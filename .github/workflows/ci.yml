name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Synthetic fixture replaces any real dataset in CI
      - run: npm run fixtures:generate
      - run: npm run fixtures:check
      # Merchant-data scan over committable files and the production build
      - run: npm run scan:merchant-data
