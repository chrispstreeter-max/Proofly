# Proofly — Shopify app configuration template. No real app is linked yet: `shopify app config link` fills in
# client_id / application_url per environment (e.g. shopify.app.development.toml, shopify.app.production.toml).
client_id = ""
name = "Proofly"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# V1 needs products only: product lookups + reviews.rating / reviews.rating_count metafields.
# No order or customer scopes (verified purchase / review requests are V1.1 and will ask for them then).
scopes = "read_products,write_products"
# Shopify-managed installation: Shopify installs the app and grants scopes; the app then obtains tokens by
# token exchange. There is no OAuth redirect flow and no manual shop-domain login.
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://example.com/auth/callback"]

# Storefront: https://<shop domain>/apps/proofly/* → {application_url}/proxy/*
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "proofly"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[pos]
embedded = false
